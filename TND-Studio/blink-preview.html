<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dhanuka · Blink sample</title><style>body{margin:0;background:#151d24;color:#e8eddf;font:15px 'Segoe UI',sans-serif;text-align:center}main{max-width:850px;margin:30px auto;padding:20px}h1{font-size:25px}p{color:#adbaa3;line-height:1.8}canvas{max-width:100%;width:720px;background:white;border-radius:16px}button,a{display:inline-block;background:#c5f277;color:#25301a;border:0;padding:12px 20px;border-radius:8px;margin:8px;text-decoration:none;cursor:pointer}label{display:block;margin:15px}input{width:230px}small{display:block;color:#9eaa99;margin:15px}span{font-variant-numeric:tabular-nums}</style><main><h1>Dhanuka · Blink sample</h1><p>මුල් පෙනුම → ඇස් වැසීම → මුල් පෙනුම<br>Eye-only draft. Hair, ears, mouth and body use the original artwork.</p><canvas width="900" height="850" id="sample"></canvas><div><button id="play">Pause</button><a href="index.html">Open TND Studio</a><a href="library/dhanuka-blink-sample.tnd.json" download>Download sample project</a></div><label>Moment <input type="range" id="moment" min="0" max="1.6" value="0" step="0.01"> <span id="time">0.00s</span></label><small>Draft for your likeness review. The blink currently blends open/closed eye poses.</small><p id="error"></p></main><script type="module">
import {composeBlinkReference,blinkAmount} from './blink.mjs';
const load=src=>new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>resolve(i);i.onerror=reject;i.src=src;});
try{const original=await load('assets/original-reference.png'),closed=composeBlinkReference(original,await load('assets/drafts/dhanuka-blink-reference.png'));const canvas=document.getElementById('sample'),g=canvas.getContext('2d'),slider=document.getElementById('moment'),label=document.getElementById('time'),button=document.getElementById('play');let playing=true,time=0,last=performance.now();const actor={charId:'dhanuka',clips:[{type:'blink',start:0,duration:30}]};function draw(){g.globalAlpha=1;g.fillStyle='white';g.fillRect(0,0,900,850);g.drawImage(original,1044,170,483,730,208,35,483,730);g.globalAlpha=blinkAmount(actor,time);g.drawImage(closed,1044,170,483,730,208,35,483,730);g.globalAlpha=1;label.textContent=time.toFixed(2)+'s';slider.value=time;}slider.oninput=()=>{playing=false;button.textContent='Play';time=Number(slider.value);draw();};button.onclick=()=>{playing=!playing;button.textContent=playing?'Pause':'Play';last=performance.now();};function frame(now){if(playing){time=(time+(now-last)/1000*.55)%1.6;draw();}last=now;requestAnimationFrame(frame);}draw();requestAnimationFrame(frame);}catch(e){document.getElementById('error').textContent='Please open using Start TND Studio.cmd. '+e.message;}
</script></html>
