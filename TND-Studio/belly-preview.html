<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dhanuka · Belly laugh rig study</title><style>body{background:#151d24;color:#edf1e6;font:15px 'Segoe UI',sans-serif;text-align:center;margin:0}main{max-width:1050px;margin:auto;padding:25px}p{color:#b0bea3;line-height:1.8}canvas{width:650px;max-width:100%;background:#f5f4ec;border-radius:15px}button,a{display:inline-block;background:#c5f277;color:#26331b;border:0;border-radius:8px;padding:12px 18px;margin:7px;text-decoration:none;font:inherit}input{width:260px}label{display:block;margin:20px}small{color:#a5b194;display:block;margin:15px}details img{max-width:100%;background:white;border-radius:12px}summary{cursor:pointer;color:#c5f277;margin:20px}</style><main><h1>Dhanuka · Belly laugh</h1><p>අත් බඩට ගෙනයන ගමන, වැලමිට සහ හිනාවේ රිද්මය පරීක්ෂා කරන මුල් rig sample එක.<br>Front-view rig draft · hands reach, settle, laugh and return. Not yet a finished natural-motion approval.</p><canvas id="belly" width="800" height="850"></canvas><div><button id="play">Pause</button><a href="library/dhanuka-belly-laugh.tnd.json" download>Download editor project</a><a href="index.html">Open editor</a></div><label>Moment <input id="moment" type="range" min="0" max="6" step="0.01" value="0"> <span id="time">0.00s</span></label><small id="phase"></small><small id="error"></small><details><summary>Pose study reference (¾ view)</summary><img src="assets/actions/belly-laugh/pose-study-v1.png" alt="Six draft belly laugh poses"></details></main><script type="module">
